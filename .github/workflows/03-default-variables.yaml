name: Print Default Variables

on:
  workflow_dispatch:

jobs:
  print-variables:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Print Default Environment Variables
        run: |
          echo "========== DEFAULT VARIABLES =========="
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Repository Owner: $GITHUB_REPOSITORY_OWNER"
          echo "Workflow Name: $GITHUB_WORKFLOW"
          echo "Run ID: $GITHUB_RUN_ID"
          echo "Run Number: $GITHUB_RUN_NUMBER"
          echo "Job ID: $GITHUB_JOB"
          echo "Action: $GITHUB_ACTION"
          echo "Commit SHA: $GITHUB_SHA"
          echo "Git Reference: $GITHUB_REF"
          echo "Branch Name: $GITHUB_REF_NAME"
          echo "Trigger Event: $GITHUB_EVENT_NAME"
          echo "Triggered By: $GITHUB_ACTOR"
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Server URL: $GITHUB_SERVER_URL"
          echo "API URL: $GITHUB_API_URL"
          echo "Run Attempt: $GITHUB_RUN_ATTEMPT"
          echo "Base Branch: $GITHUB_BASE_REF"
          echo "Head Branch: $GITHUB_HEAD_REF"

      - name: Print GitHub Context
        run: |
          echo "========== GITHUB CONTEXT =========="
          echo "Repository: ${{ github.repository }}"
          echo "Owner: ${{ github.repository_owner }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"
          echo "Job: ${{ github.job }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Ref: ${{ github.ref }}"
          echo "Ref Name: ${{ github.ref_name }}"
          echo "Event Name: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"

      - name: Print Runner Context
        run: |
          echo "========== RUNNER CONTEXT =========="
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Architecture: ${{ runner.arch }}"
          echo "Runner Name: ${{ runner.name }}"
          echo "Temporary Directory: ${{ runner.temp }}"
          echo "Tool Cache: ${{ runner.tool_cache }}"

      - name: Print Job Context
        run: |
          echo "========== JOB CONTEXT =========="
          echo "Job Status: ${{ job.status }}"

      - name: Print Event Payload Details
        run: |
          echo "========== EVENT DETAILS =========="
          echo "Event Name: ${{ github.event_name }}"
          echo "Event Action: ${{ github.event.action }}"
          echo "Event Path: $GITHUB_EVENT_PATH"