name: User Input Workflow

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Enter your name'
        required: true
        type: string
      
      deploy: 
        description: 'Do you want to deploy the application?' 
        required: true 
        type: boolean
        default: false

jobs:
  print-input:
    runs-on: ubuntu-latest

    steps:
      - name: Print User Input
        run: |
          echo "Hello, ${{ inputs.username }}!"
