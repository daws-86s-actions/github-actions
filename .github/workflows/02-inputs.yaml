name: User Input Testing

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Enter your name'
        required: true
        type: string

      age:
        description: 'Enter your age'
        required: true
        type: number

      is_student:
        description: 'Are you a student?'
        required: true
        type: boolean
        default: false

      environment:
        description: 'Select the deployment environment'
        required: true
        type: environment

jobs:
  print-inputs:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Print All Inputs
        run: |
          echo "Username: ${{ inputs.username }}"
          echo "Age: ${{ inputs.age }}"
          echo "Is Student: ${{ inputs.is_student }}"
          echo "Environment: ${{ inputs.environment }}"